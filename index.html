<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Bot Pairing</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b141a;
            color: #e9edef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #111b21;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            color: #00a884;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #8696a0;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #2a3942;
            border-radius: 8px;
            background-color: #202c33;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #00a884;
        }
        button {
            width: 96%;
            padding: 12px;
            background-color: #00a884;
            border: none;
            border-radius: 8px;
            color: #111b21;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #008f6f;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #202c33;
            display: none;
        }
        .code-box {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00a884;
            margin-top: 5px;
            user-select: all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>WhatsApp Pairing</h2>
    <p>Country code ke saath apna WhatsApp number likhein (bina + ke, maslan: 923001234567)</p>
    
    <input type="text" id="phone" placeholder="923001234567" required>
    <button onclick="getPairingCode()" id="btn">Get Pairing Code</button>

    <div id="result"></div>
</div>

<script>
    async function getPairingCode() {
        const phone = document.getElementById('phone').value.trim();
        const resultDiv = document.getElementById('result');
        const btn = document.getElementById('btn');

        if (!phone) {
            alert('Pehle apna WhatsApp number darj karein!');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Code generate ho raha hai...';
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'Intezar karein...';

        try {
            const response = await fetch(`/pair?number=${encodeURIComponent(phone)}`);
            const data = await response.json();

            if (data.code) {
                resultDiv.innerHTML = `
                    <span>Aapka Link Device Code:</span>
                    <div class="code-box">${data.code}</div>
                    <p style="margin-top:10px; font-size:12px;">WhatsApp > Linked Devices > Link with phone number mein yeh code dalein.</p>
                `;
            } else if (data.message) {
                resultDiv.innerHTML = `<span style="color:#00a884;">${data.message}</span>`;
            } else {
                resultDiv.innerHTML = `<span style="color:#f15c6d;">${data.error || 'Koi masla aaya hai.'}</span>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<span style="color:#f15c6d;">Server se connect nahi ho saka.</span>`;
        } finally {
            btn.disabled = false;
            btn.innerText = 'Get Pairing Code';
        }
    }
</script>

</body>
</html>
